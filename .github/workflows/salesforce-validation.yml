name: Salesforce CI Validation

on:
  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Salesforce CLI
        run: npm install --global @salesforce/cli

      - name: Authenticate to QA Org
        run: |
          echo "${{ secrets.QA_SFDX_AUTH_URL }}" > authfile.txt
          sf org login sfdx-url --sfdx-url-file authfile.txt --alias QAOrg
          rm authfile.txt

      - name: Validate Salesforce metadata
        run: |
          sf project deploy validate \
            --metadata "CustomField:Project__c.Project_Category__c" \
            --target-org QAOrg